name: Surf Bot

on:
  schedule:
    # Roda às 03, 09, 15, 21 UTC → 00, 06, 12, 18 BRT
    # O script detecta se é 09 UTC para enviar o digest; demais horas = alertas
    - cron: "0 3,9,15,21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo: digest ou alerts'
        required: false
        default: 'digest'

jobs:
  surf-bot:
    name: Surf Bot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FORECAST_DAYS: "5"
          MIN_ALERT_SCORE: "2"
        run: |
          HOUR=$(date -u +%H)
          MODE="${{ github.event.inputs.mode }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Rodando manualmente: usa o input (padrão: digest)
            MODE="${MODE:-digest}"
          elif [ "$HOUR" = "09" ]; then
            MODE="digest"
          else
            MODE="alerts"
          fi

          echo "Modo selecionado: $MODE (hora UTC: $HOUR)"
          python main.py --$MODE
