name: Surf Bot

on:
  schedule:
    # Digest diário às 06:00 BRT (= 09:00 UTC)
    - cron: "0 9 * * *"
    # Verificação de alertas a cada 6h: 03, 15, 21 UTC (00, 12, 18 BRT)
    - cron: "0 3,15,21 * * *"
  workflow_dispatch:  # permite rodar manualmente pelo GitHub

jobs:
  surf-digest:
    name: Digest Diário
    if: github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Enviar digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FORECAST_DAYS: "5"
          MIN_ALERT_SCORE: "2"
        run: python main.py --digest

  surf-alerts:
    name: Verificar Alertas
    if: github.event.schedule == '0 3,15,21 * * *'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Verificar e enviar alertas
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          FORECAST_DAYS: "5"
          MIN_ALERT_SCORE: "2"
        run: python main.py --alerts
